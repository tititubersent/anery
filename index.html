<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D - Anery</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loader { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; text-align: center; z-index: 10; width: 80%;
        }
        #progress-container {
            width: 100%; background: #333; height: 10px; border-radius: 5px; margin-top: 15px;
        }
        #progress-bar {
            width: 0%; background: #09d; height: 100%; border-radius: 5px; transition: width 0.2s;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div id="status">🚀 Connexion au fichier...</div>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="details" style="margin-top:10px; font-size: 12px; color: #888;">Préparation (52 Mo)</div>
    </div>

    <script type="module">
        import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';

        const statusText = document.getElementById('status');
        const progressBar = document.getElementById('progress-bar');
        const detailsText = document.getElementById('details');

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 10, 20],
            'initialCameraLookAt': [0, 0, 0]
        });

        async function loadWithProgress() {
            try {
                // On utilise le nom de fichier PUR, sans rien après, pour que le lecteur le reconnaisse
                await viewer.addSplatScene('domaine_anery2.splat', {
                    'showLoadingUI': false,
                    'onProgress': (percent, percentText) => {
                        const p = Math.round(percent);
                        progressBar.style.width = p + '%';
                        detailsText.innerText = p + '% téléchargé';
                        statusText.innerText = "📥 Téléchargement en cours...";
                    }
                });

                statusText.innerText = "✨ Initialisation de la 3D...";
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    viewer.start();
                }, 500);

            } catch (err) {
                console.error(err);
                statusText.innerHTML = "❌ Erreur.<br><small>Faites CTRL + F5</small>";
            }
        }

        loadWithProgress();
    </script>
</body>
</html>
