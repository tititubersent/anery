<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domaine Anery - Vue Libre</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        #loader { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; text-align: center; z-index: 10; font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div id="status">Chargement du jardin...</div>
        <div id="progress" style="color: #00ff88; font-weight: bold;">0%</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.3.4/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as GaussianSplats3D from 'gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 10, 20],
            'initialCameraLookAt': [0, 0, 0],
            // On enlève integerLayout pour éviter la déformation
        });

        viewer.addSplatScene('domaine_anery2.splat', {
            'showLoadingUI': false,
            // Rotation pour remettre le jardin bien à plat au départ
            'rotation': [3.14159, 0, 0], 
            'onProgress': (percent) => {
                document.getElementById('progress').innerText = Math.round(percent) + '%';
            }
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            
            // LIBÉRATION TOTALE DE LA CAMÉRA
            if (viewer.controls) {
                viewer.controls.enableDamping = true;
                viewer.controls.dampingFactor = 0.1; // Pour la fluidité du mouvement
                
                // Débloque la rotation verticale (permet de faire le tour complet)
                viewer.controls.minPolarAngle = -Infinity;
                viewer.controls.maxPolarAngle = Infinity;
            }

            viewer.start();
        });
    </script>
</body>
</html>
