<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="loading">🚀 Chargement de l'univers 3D...<br><small>Fichier de 52 Mo - Patience</small></div>

    <script type="module">
        // On utilise l'adresse qui marchait au début
        import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 10, 20],
            'initialCameraLookAt': [0, 0, 0]
        });

        // On tente de charger le fichier localement
        viewer.addSplatScene('./domaine_anery2.splat', {
            'showLoadingUI': true
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            console.error("Erreur détaillée :", err);
            document.getElementById('loading').innerHTML = "Le moteur est prêt, mais le fichier .splat est introuvable.<br>Vérifiez qu'il est bien nommé 'domaine_anery2.splat' sur GitHub Desktop.";
        });
    </script>
</body>
</html>
