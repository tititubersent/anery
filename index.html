<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #111; overflow: hidden; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        #status { padding: 20px; border: 1px dashed #555; border-radius: 10px; text-align: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="status">Chargement du moteur...</div>

    <script type="module">
        // On utilise esm.sh, c'est beaucoup plus fiable pour GitHub Pages
        import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';

        const status = document.getElementById('status');

        async function init() {
            try {
                status.innerHTML = "Moteur OK. Chargement du fichier 3D...<br><small>(52 Mo - patience)</small>";

                const viewer = new GaussianSplats3D.Viewer({
                    'sharedMemoryForWorkers': false,
                    'initialCameraPosition': [0, 5, 15],
                    'initialCameraLookAt': [0, 0, 0]
                });

                // Chargement de votre fichier
                viewer.addSplatScene('domaine_anery2.splat', {
                    'showLoadingUI': true,
                })
                .then(() => {
                    status.style.display = 'none'; // On cache le texte quand c'est fini
                    viewer.start();
                })
                .catch((err) => {
                    status.innerHTML = "Erreur de lecture du fichier .splat<br>Vérifiez qu'il est bien sur GitHub.";
                    console.error(err);
                });

            } catch (e) {
                status.innerHTML = "Erreur : " + e.message;
                console.error(e);
            }
        }

        init();
    </script>
</body>
</html>
