<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="loading">🚀 Préparation du domaine 3D...<br><small>Chargement du fichier (52 Mo)</small></div>

    <script type="module">
        import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.3.4/dist/gaussian-splats-3d.module.js';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 5, 15],
            'initialCameraLookAt': [0, 0, 0]
        });

        // On utilise un chemin relatif simple
        const file = 'domaine_anery2.splat';

        console.log("Démarrage du chargement de :", file);

        viewer.addSplatScene(file, {
            'showLoadingUI': true
        })
        .then(() => {
            console.log("Chargement réussi !");
            document.getElementById('loading').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            console.error("Détail de l'erreur :", err);
            document.getElementById('loading').innerHTML = "Erreur technique : Le fichier est là mais le navigateur refuse de le lire.<br>Essayez de vider le cache (CTRL+F5).";
        });
    </script>
</body>
</html>
