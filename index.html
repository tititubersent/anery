<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
    </style>
</head>
<body>
    <script type="module">
        import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';

        // Configuration ultra-simplifiée
        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 10, 20],
            'initialCameraLookAt': [0, 0, 0]
        });

        // On charge directement le fichier. 
        // L'option 'format': 'splat' force le moteur à ne pas se poser de question.
        viewer.addSplatScene('domaine_anery2.splat', {
            'format': 'splat',
            'showLoadingUI': true // Utilise la barre de chargement officielle du moteur
        })
        .then(() => {
            viewer.start();
        })
        .catch((err) => {
            console.error("Erreur de chargement:", err);
            alert("Erreur lors de l'affichage de la 3D. Vérifiez le nom du fichier.");
        });
    </script>
</body>
</html>
