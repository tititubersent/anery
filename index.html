<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; }
    </style>
</head>
<body>
    <div id="loading">Initialisation du domaine...</div>

    <script type="module">
        import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 10, 20],
            'initialCameraLookAt': [0, 0, 0]
        });

        // On force le format 0 (qui veut dire .splat pour le moteur)
        // Cela règle définitivement l'erreur "File format not supported"
        viewer.addSplatScene('domaine_anery2.splat', {
            'format': 0, 
            'showLoadingUI': true
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            document.getElementById('loading').innerHTML = "Erreur : Fichier introuvable ou mal nommé.";
            console.error(err);
        });
    </script>
</body>
</html>
