<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domaine Anery 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-family: sans-serif; text-align: center;
        }
    </style>
</head>
<body>

    <div id="loader">Chargement du Domaine...</div>

    <script type="module">
        // On utilise le moteur original, plus léger et sans déformations
        import { SplatViewer } from 'https://cdn.jsdelivr.net/npm/@antimatter15/splat@0.0.3/+esm';

        const canvas = document.createElement('canvas');
        document.body.appendChild(canvas);

        const viewer = new SplatViewer(canvas, {
            // Remplacez par le nom exact de votre fichier
            url: 'domaine_anery2.splat',
            
            // On règle la caméra pour que le jardin soit à l'endroit dès le départ
            cameraUp: [0, -1, 0], 
            initialCameraPosition: [0, 2, 5],
            
            // Paramètres de fluidité
            onProgress: (p) => {
                if (p >= 1) document.getElementById('loader').style.display = 'none';
            }
        });

        // Rotation automatique très lente pour la présentation
        let angle = 0;
        function animate() {
            requestAnimationFrame(animate);
            // Si vous voulez que ça tourne tout seul, décommentez la ligne suivante :
            // viewer.camera.position.set(Math.sin(angle)*10, 5, Math.cos(angle)*10);
            // angle += 0.005;
        }
        animate();
    </script>
</body>
</html>
