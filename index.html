<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
    </style>
</head>
<body>
    <script type="module">
        import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 10, 20],
            'initialCameraLookAt': [0, 0, 0]
        });

        // La méthode "Scenes" (avec un S) est plus robuste
        viewer.addSplatScenes([
            {
                'path': 'domaine_anery2.splat',
                'format': 'splat', // On force le format ici
                'splatAlphaRemovalThreshold': 5,
            }
        ], true)
        .then(() => {
            viewer.start();
        })
        .catch((err) => {
            console.error(err);
        });
    </script>
</body>
</html>
