<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domaine Anery 3D - Rotation Libre</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loader { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; text-align: center; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div id="status">Chargement du domaine...</div>
        <div id="progress" style="color: #00ff88; font-weight: bold; margin-top: 10px;">0%</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.3.4/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as GaussianSplats3D from 'gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 15, 25], // Reculé et en hauteur
            'initialCameraLookAt': [0, 0, 0],      // Regarde le centre
            'cameraUp': [0, -1, 0],                // INVERSION : Permet de pivoter sans blocage
            'dynamicScene': true
        });

        const fileUrl = 'domaine_anery2.splat';

        viewer.addSplatScene(fileUrl, {
            'showLoadingUI': false,
            // On tourne de 90 degrés pour mettre le jardin "à plat"
            'rotation': [-1.57, 0, 0], 
            'scale': [1, 1, 1],
            'onProgress': (percent) => {
                document.getElementById('progress').innerText = Math.round(percent) + '% chargés';
            }
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            document.getElementById('status').innerHTML = "❌ Erreur de chargement";
            console.error(err);
        });
    </script>
</body>
</html>
