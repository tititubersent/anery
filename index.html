<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domaine Anery 3D - Fluide</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        #loader { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; text-align: center; z-index: 10; font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div id="status">Chargement fluide...</div>
        <div id="progress" style="color: #00ff88; font-weight: bold;">0%</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.3.4/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as GaussianSplats3D from 'gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 10, 20],
            'initialCameraLookAt': [0, 0, 0],
            'dynamicScene': true,
            'gpuAccelerated': true, // Active l'accélération carte graphique
            'integerLayout': true   // Améliore la vitesse de rendu
        });

        viewer.addSplatScene('domaine_anery2.splat', {
            'showLoadingUI': false,
            // Ces réglages remettent le modèle bien à plat et centré
            'rotation': [3.14, 0, 0], 
            'scale': [1, 1, 1],
            'position': [0, 0, 0],
            'onProgress': (percent) => {
                document.getElementById('progress').innerText = Math.round(percent) + '%';
            }
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            
            // CONFIGURATION DE LA ROTATION LIBRE (SANS BLOCAGE)
            const controls = viewer.controls;
            if (controls) {
                controls.enableDamping = true; // Rend le mouvement "soyeux"
                controls.dampingFactor = 0.05;
                controls.screenSpacePanning = true;
                // Supprime les limites de rotation pour bouger dans tous les sens
                controls.minPolarAngle = 0; 
                controls.maxPolarAngle = Math.PI; 
            }

            viewer.start();
        });
    </script>
</body>
</html>
