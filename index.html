<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; z-index: 10; }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.3.4/dist/gaussian-splats-3d.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="loading">Chargement du modèle 3D... (52 Mo)</div>
    <script type="module">
        import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
        
        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 5, 10],
            'initialCameraLookAt': [0, 0, 0]
        });

        // On charge directement votre fichier local
        viewer.addSplatScene('domaine_anery2.splat', {
            'showLoadingUI': true,
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            document.getElementById('loading').innerHTML = "Erreur de chargement : " + err;
        });
    </script>
</body>
</html>
