<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; }
    </style>
</head>
<body>
    <div id="loader">🚀 Chargement du domaine... (52 Mo)</div>

    <script type="module">
        import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 5, 15],
            'initialCameraLookAt': [0, 0, 0]
        });

        // On utilise le lien direct pour être sûr à 100%
        const url = './domaine_anery2.splat';

        viewer.addSplatScene(url, {
            'showLoadingUI': true
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            console.error(err);
            document.getElementById('loader').innerHTML = "Erreur de chargement.<br>Vérifiez que le fichier .nojekyll est bien présent sur GitHub.";
        });
    </script>
</body>
</html>
