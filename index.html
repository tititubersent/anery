<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domaine Anery 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loader { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: white; text-align: center; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div id="status">Chargement du domaine...</div>
        <div id="progress" style="color: #00ff88; font-weight: bold; margin-top: 10px;">0%</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.3.4/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as GaussianSplats3D from 'gaussian-splats-3d';

        const statusText = document.getElementById('status');
        const progressText = document.getElementById('progress');

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            // POSITION DE LA CAMÉRA : [X, Y, Z]
            // Y=25 met la caméra très haut pour la vue de dessus
            // Z=10 donne un léger angle pour voir les façades
            'initialCameraPosition': [0, 25, 15], 
            'initialCameraLookAt': [0, 0, 0],
            'sphericalHarmonicsDegree': 0
        });

        const fileUrl = window.location.origin + window.location.pathname + 'domaine_anery2.splat';

        viewer.addSplatScene(fileUrl, {
            'showLoadingUI': false,
            // ROTATION DU MODÈLE : On le pivote pour qu'il soit à plat
            // [Math.PI, 0, 0] = Rotation de 180° sur l'axe X
            'rotation': [Math.PI, 0, 0], 
            'scale': [1, 1, 1],
            'onProgress': (percent) => {
                progressText.innerText = Math.round(percent) + '% chargés';
            }
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            statusText.innerHTML = "❌ Erreur d'affichage";
            console.error(err);
        });
    </script>
</body>
</html>
