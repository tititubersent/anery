<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Domaine 3D</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="loading">Initialisation du moteur 3D...</div>

    <script type="module">
        import * as GaussianSplats3D from 'https://esm.sh/@mkkellogg/gaussian-splats-3d';

        // On utilise l'adresse complète qui fonctionne
        const urlFichier = 'https://tititubersent.github.io/anery/domaine_anery2.splat';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            'initialCameraPosition': [0, 10, 20],
            'initialCameraLookAt': [0, 0, 0]
        });

        console.log("Tentative de chargement de :", urlFichier);

        viewer.addSplatScene(urlFichier, {
            'format': 0,
            'showLoadingUI': true
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            viewer.start();
        })
        .catch((err) => {
            document.getElementById('loading').innerHTML = "Erreur de chargement. Essayez de rafraîchir la page.";
            console.error(err);
        });
    </script>
</body>
</html>
