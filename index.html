<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domaine Anery - Qualité Max</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; }
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; text-align: center; }
    </style>
</head>
<body>
    <div id="loader">Chargement de la haute définition...<br><span id="progress">0%</span></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.3.4/build/gaussian-splats-3d.module.js"
        }
    }
    </script>

    <script type="module">
        import * as GaussianSplats3D from 'gaussian-splats-3d';

        const viewer = new GaussianSplats3D.Viewer({
            'sharedMemoryForWorkers': false,
            // On définit le "Haut" de la caméra pour compenser l'inclinaison du modèle
            // Si le modèle est encore à l'envers, on changera le -1 en 1 ici :
            'cameraUp': [0, -1, 0], 
            'initialCameraPosition': [0, 5, 15],
            'initialCameraLookAt': [0, 0, 0]
        });

        viewer.addSplatScene('domaine_anery2.splat', {
            'showLoadingUI': false,
            // ON NE TOUCHE PLUS A LA ROTATION ICI POUR ÉVITER LES DÉFORMATIONS
            'rotation': [0, 0, 0],
            'onProgress': (percent) => {
                document.getElementById('progress').innerText = Math.round(percent) + '%';
            }
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            
            // CONTROLES FLUIDES ET LIBRES
            if (viewer.controls) {
                viewer.controls.enableDamping = true;
                viewer.controls.dampingFactor = 0.07;
                viewer.controls.rotateSpeed = 1.0;
                // Permet de tourner dans TOUS les sens sans blocage
                viewer.controls.minPolarAngle = -Infinity;
                viewer.controls.maxPolarAngle = Infinity;
            }

            viewer.start();
        });
    </script>
</body>
</html>
